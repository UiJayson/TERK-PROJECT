  primary_intent:
    - product_fit
    - pricing
  required_tools:
    - knowledge.search
    - crm.contact.read
  forbidden_tools:
    - calendar.booking.create_pending
  response_requirements:
    - discusses_product_fit
    - does_not_invent_pricing
