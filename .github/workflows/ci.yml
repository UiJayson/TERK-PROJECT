# CI/CD for AI Business OS
#
# Push (any branch)        → typecheck, unit tests, security scan
# Pull request             → the above + production build + bundle-size budget
# Push to main             → deploy to STAGING  (needs NETLIFY_AUTH_TOKEN + NETLIFY_STAGING_SITE_ID secrets)
# Tag v*                   → deploy to PRODUCTION (needs NETLIFY_AUTH_TOKEN + NETLIFY_PROD_SITE_ID secrets)
#
# Secrets to configure (repo → Settings → Secrets → Actions):
#   NETLIFY_AUTH_TOKEN        Personal access token (Netlify → User settings → Applications)
#   NETLIFY_STAGING_SITE_ID   Site ID of the staging site
#   NETLIFY_PROD_SITE_ID      Site ID of the production site

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Typecheck, tests, security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Typecheck (app)
        run: npx tsc -b
        working-directory: web

      # ~25 pre-existing type errors in untouched functions (see docs/PERFORMANCE.md
      # notes); advisory until they're burned down, then drop continue-on-error.
      - name: Typecheck (functions — advisory)
        run: npx tsc -p tsconfig.functions.json --noEmit
        working-directory: web
        continue-on-error: true

      - name: Unit & integration tests
        run: npm run test:all

      - name: Agent behavior evals
        run: npm run eval
        continue-on-error: true # evals are advisory until fixtures are deterministic

      - name: Dependency audit
        run: |
          npm audit --audit-level=high
          npm audit --prefix web --audit-level=high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build + bundle budget
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Production build
        run: npm run build

      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: web/dist
          retention-days: 7

  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      # netlify deploy --build runs the build with the site's env vars and
      # bundles the functions — do not reuse the artifact from the build job,
      # functions are compiled at deploy time.
      - name: Deploy to Netlify (staging)
        run: npx netlify-cli deploy --build --prod --message "staging ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_STAGING_SITE_ID }}

      - name: Post-deploy health check
        run: node scripts/health-check.mjs "$STAGING_URL"
        env:
          STAGING_URL: ${{ vars.STAGING_URL || 'https://harbor-ai-staging.netlify.app' }}

  deploy-production:
    name: Deploy → production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production # add required reviewers here for a manual gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Deploy to Netlify (production)
        run: npx netlify-cli deploy --build --prod --message "release ${{ github.ref_name }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PROD_SITE_ID }}

      - name: Post-deploy health check
        run: node scripts/health-check.mjs "$PROD_URL"
        env:
          PROD_URL: ${{ vars.PROD_URL || 'https://harbor-ai-business-os.netlify.app' }}
